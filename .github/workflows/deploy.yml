name: Test and deploy gtalent_ecommerce_2026 to AWS EC2

on:
  pull_request:
    branches:
      - release
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Build and test
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: gtalent_ecommerce_2026_test
          MYSQL_USER: gtalent_ecommerce_2026_test
          MYSQL_PASSWORD: ci_test_password
          MYSQL_ROOT_PASSWORD: ci_root_password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -pci_root_password"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - name: Checkout source code
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Java 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Build and test with MySQL and JPA
        env:
          TEST_DB_NAME: gtalent_ecommerce_2026_test
          TEST_DB_PORT: "3306"
          TEST_DB_USERNAME: gtalent_ecommerce_2026_test
          TEST_DB_PASSWORD: ci_test_password
          SPRING_JPA_HIBERNATE_DDL_AUTO: validate
          SPRING_JPA_OPEN_IN_VIEW: "false"
          SPRING_FLYWAY_ENABLED: "true"
          SPRING_FLYWAY_VALIDATE_ON_MIGRATE: "true"
          SPRING_FLYWAY_CLEAN_DISABLED: "true"
        run: |
          chmod +x mvnw
          ./mvnw --batch-mode --no-transfer-progress clean package

      - name: Prepare deployment artifact
        if: >-
          github.ref == 'refs/heads/main' &&
          (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        run: |
          cp target/gtalent_ecommerce_2026-0.0.1-SNAPSHOT.jar target/app.jar
          test -s target/app.jar

      - name: Upload deployment artifact
        if: >-
          github.ref == 'refs/heads/main' &&
          (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        uses: actions/upload-artifact@v4
        with:
          name: production-jar
          path: target/app.jar
          if-no-files-found: error
          retention-days: 1

  deploy:
    name: Deploy production
    needs:
      - test
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: gtalent_ecommerce_2026-production-deploy
      cancel-in-progress: false
    environment:
      name: production
      url: https://gta-2026.edwardforce.tw

    steps:
      - name: Download deployment artifact
        uses: actions/download-artifact@v4
        with:
          name: production-jar
          path: target

      - name: Configure SSH
        env:
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
          EC2_KNOWN_HOSTS: ${{ secrets.EC2_KNOWN_HOSTS }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$EC2_SSH_KEY" > ~/.ssh/gtalent_ecommerce_2026_deploy
          chmod 600 ~/.ssh/gtalent_ecommerce_2026_deploy
          printf '%s\n' "$EC2_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Prepare remote directory and upload JAR
        env:
          EC2_HOST: ${{ vars.EC2_HOST }}
          EC2_USER: ${{ vars.EC2_USER }}
        run: |
          test -n "$EC2_HOST"
          test -n "$EC2_USER"
          ssh \
            -i ~/.ssh/gtalent_ecommerce_2026_deploy \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            -o ConnectTimeout=10 \
            "$EC2_USER@$EC2_HOST" \
            "install -d -m 755 /home/ubuntu/gtalent_ecommerce_2026/target && test -w /home/ubuntu/gtalent_ecommerce_2026/target"
          scp \
            -i ~/.ssh/gtalent_ecommerce_2026_deploy \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            -o ConnectTimeout=10 \
            target/app.jar \
            "$EC2_USER@$EC2_HOST:/home/ubuntu/gtalent_ecommerce_2026/target/app.jar.new"

      - name: Activate release and verify
        env:
          EC2_HOST: ${{ vars.EC2_HOST }}
          EC2_USER: ${{ vars.EC2_USER }}
        run: |
          ssh \
            -i ~/.ssh/gtalent_ecommerce_2026_deploy \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            -o ConnectTimeout=10 \
            "$EC2_USER@$EC2_HOST" 'bash -se' <<'REMOTE_SCRIPT'
          set -u

          APP_DIR=/home/ubuntu/gtalent_ecommerce_2026
          CURRENT_JAR="$APP_DIR/target/app.jar"
          BACKUP_JAR="$APP_DIR/target/app.jar.previous"
          INCOMING_JAR="$APP_DIR/target/app.jar.new"
          HEALTH_URL=http://127.0.0.1:8081/actuator/health

          test -s "$INCOMING_JAR"

          if test -f "$CURRENT_JAR"; then
            cp "$CURRENT_JAR" "$BACKUP_JAR"
          fi

          mv "$INCOMING_JAR" "$CURRENT_JAR"
          sudo -n systemctl restart gtalent_ecommerce_2026.service

          for attempt in $(seq 1 30); do
            if curl --fail --silent --show-error "$HEALTH_URL" > /dev/null; then
              echo "Deployment succeeded."
              exit 0
            fi
            sleep 2
          done

          echo "Health check failed."
          systemctl status gtalent_ecommerce_2026.service --no-pager || true
          journalctl -u gtalent_ecommerce_2026.service -n 80 --no-pager || true

          if test -s "$BACKUP_JAR"; then
            echo "Rolling back to the previous JAR."
            mv "$BACKUP_JAR" "$CURRENT_JAR"
            sudo -n systemctl restart gtalent_ecommerce_2026.service

            for attempt in $(seq 1 30); do
              if curl --fail --silent --show-error "$HEALTH_URL" > /dev/null; then
                echo "Rollback succeeded."
                exit 1
              fi
              sleep 2
            done

            echo "Rollback was attempted, but the previous version is not healthy."
          else
            echo "No previous JAR is available for rollback."
          fi

          exit 1
          REMOTE_SCRIPT